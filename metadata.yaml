# 插件的唯一标识名 (不要改)
name: astrbot_plugin_group_welcome

# 插件展示名 (显示在 UI 界面上的名字，可以更友好)
display_name: Group Welcome (入群欢迎插件)

# 插件的一句话简介
desc: 支持按群配置固定/AI 欢迎词与上传欢迎表情包的群欢迎插件

# 插件的详细帮助信息或指令列表
help: 可直接在插件设置界面配置每个群的欢迎模式、欢迎词、AI 提示词和欢迎表情包。

# 插件版本号
version: 3.0.0

# 作者名
author: lingyun

# (可选) 你的 GitHub 仓库地址
repo: "https://github.com/inkbarrel/astrbot_plugin_group_welcome"

# (新增) 插件 Logo 文件名
# 对应你放在插件目录下的 logo.png 文件
logo: logo.png

# (新增) 声明支持的平台
support_platforms:
  - aiocqhttp

# (新增) 声明支持的 AstrBot 版本范围
astrbot_version: ">=v4.12.0"




